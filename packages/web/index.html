<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
  </head>
  <body>
    <!--
      Vite uses this file as the app entry. `#app` is the single mount point the
      shell renders into; `src/main.ts` (an ES module) bootstraps it. No
      calculator UI lives here yet — the keypad, stack display, and dispatch
      wiring arrive in later web features (CALC-F04+). This shell exists so the
      build, dev server, and tests have a real DOM to grow into.
    -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
