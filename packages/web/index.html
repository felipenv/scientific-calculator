<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
  </head>
  <body>
    <!--
      Vite uses this file as the app entry. `#app` is the single mount point the
      calculator renders into; `src/app.ts` (an ES module) composes the core,
      display, and keypad and wires both input methods through the shared
      dispatch controller (CALC-F04), then bootstraps on load.
    -->
    <div id="app"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
